[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
remappings = [
  "forge-std/=lib/forge-std/src/",
  "v4-core/=lib/v4-core/src/",
  "v4-periphery/=lib/v4-periphery/src/",
  "@uniswap/v4-core/=lib/v4-core/",
  "@openzeppelin/contracts/=lib/v4-core/lib/openzeppelin-contracts/contracts/",
  "openzeppelin-contracts/=lib/v4-core/lib/openzeppelin-contracts/",
  "solmate/=lib/v4-core/lib/solmate/src/",
]
fuzz = { runs = 1000, max_test_rejects = 200000 }
invariant = { runs = 256, depth = 64, fail_on_revert = true }
gas_reports = ["CreditEngine", "SpanMathLib", "RwaStressLib", "PortfolioMarginHook"]
fs_permissions = [{ access = "read", path = "../test-golden" }, { access = "read-write", path = "../deploy" }]

[profile.ci]
fuzz = { runs = 10000, max_test_rejects = 500000 }
invariant = { runs = 512, depth = 96, fail_on_revert = true }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

[lint]
lint_on_build = false
severity = ["high"]

[rpc_endpoints]
base = "${RPC_FORK_URL}"
mainnet = "${RPC_ETH_MAINNET}"
